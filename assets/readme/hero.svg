          <text x="32" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">沪深300</text>
          <text x="78" y="14" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">4658.15</text>
        </g>

        <!-- Index 3: 创业板 -->
