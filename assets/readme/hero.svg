        <circle cx="9" cy="9" r="8" fill="none" stroke="#64748B" stroke-width="1.2" />
        <path d="M12 6 A4.5 4.5 0 1 1 7.5 4.5" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
        <path d="M9 3 l2.5 1.5 L9 6 Z" fill="#64748B" />
      </g>
      <!-- Eye Mask Icon -->
