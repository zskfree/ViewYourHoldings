          <rect width="170" height="20" rx="4" fill="#F8FAFC" />
          <text x="32" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">创业板</text>
          <text x="74" y="14" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">3535.14</text>
