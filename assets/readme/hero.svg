        <text x="0" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">今日浮盈</text>
        <text x="80" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">持仓盈亏</text>

        <text x="0" y="44" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">-24.00</text>
        <text x="80" y="44" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">-2494.40</text>
      </g>
    </g>

    <!-- Dotted Divider Line -->
    <line x1="20" y1="138" x2="500" y2="138" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" />

    <!-- 3. Table Column Headers -->
    <g transform="translate(20, 168)">
      <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">名称</text>
      <text x="140" y="0" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">最新价</text>
      <text x="240" y="0" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">涨跌幅 ↕</text>
      <text x="330" y="0" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">今日浮盈</text>
      <text x="470" y="0" text-anchor="end" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">持仓盈亏</text>

      <!-- Underline Border below table header -->
      <line x1="0" y1="12" x2="480" y2="12" stroke="#F1F5F9" stroke-width="1.5" />
    </g>

    <!-- 4. Stock Rows (Directly matching User's Image) -->
