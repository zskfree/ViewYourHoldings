      <!-- Row 1: 天目湖 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">天目湖</text>
        <text x="140" y="14" text-anchor="end" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">8.90</text>
        <text x="240" y="14" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">-0.34%</text>
        <text x="330" y="14" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">-12.00</text>
        <text x="470" y="8" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">-1193.20</text>
        <text x="470" y="24" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">-25.10%</text>
        
        <line x1="0" y1="36" x2="480" y2="36" stroke="#F8FAFC" stroke-width="1" />
      </g>

      <!-- Row 2: 曲江文旅 -->
      <g transform="translate(0, 46)">
        <text x="0" y="14" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">曲江文旅</text>
        <text x="140" y="14" text-anchor="end" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">7.63</text>
        <text x="240" y="14" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">-0.39%</text>
        <text x="330" y="14" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">-12.00</text>
        <text x="470" y="8" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">-1301.20</text>
        <text x="470" y="24" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">-29.89%</text>

        <line x1="0" y1="36" x2="480" y2="36" stroke="#F8FAFC" stroke-width="1" />
      </g>

      <!-- Row 3: 比亚迪 -->
      <g transform="translate(0, 92)">
        <text x="0" y="14" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">比亚迪</text>
        <text x="140" y="14" text-anchor="end" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">90.82</text>
        <text x="240" y="14" text-anchor="end" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">-0.36%</text>
        <text x="330" y="14" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">--</text>
        <text x="470" y="14" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">--</text>

        <line x1="0" y1="34" x2="480" y2="34" stroke="#F8FAFC" stroke-width="1" />
      </g>

      <!-- Row 4: 宁德时代 -->
      <g transform="translate(0, 134)">
        <text x="0" y="14" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">宁德时代</text>
        <text x="140" y="14" text-anchor="end" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">405.20</text>
        <text x="240" y="14" text-anchor="end" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">+2.56%</text>
        <text x="330" y="14" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">--</text>
        <text x="470" y="14" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">--</text>
