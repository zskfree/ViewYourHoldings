        <circle cx="10" cy="9" r="4" fill="none" stroke="#64748B" stroke-width="1.5" />
        <path d="M 2 9 Q 10 2 18 9 Q 10 16 2 9 Z" fill="none" stroke="#64748B" stroke-width="1.5" />
      </g>
    </g>

    <!-- 2. Market Indices (Top Right) & Profit Summary (Top Left) -->
    <g transform="translate(20, 56)">
      <!-- Right Market Indices Pills -->
      <g transform="translate(310, 0)">
        <!-- Index 1: 上证 -->
        <rect width="170" height="20" rx="4" fill="#F8FAFC" />
        <text x="44" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">上证</text>
        <text x="74" y="14" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">3878.43</text>

        <!-- Index 2: 沪深300 -->
        <g transform="translate(0, 24)">
