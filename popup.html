<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>极简盯盘-持仓盈亏</title>
<style>

  :root {
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --border-focus: #3b82f6;

    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;

    --up-color: #ef4444;
    --up-bg: rgba(239, 68, 68, 0.08);
    --down-color: #10b981;
    --down-bg: rgba(16, 185, 129, 0.08);

    --btn-primary-bg: #0f172a;
    --btn-primary-text: #ffffff;
    --btn-primary-hover: #1e293b;
    --btn-danger-bg: #ef4444;
    --btn-danger-hover: #dc2626;

    --radius-lg: 12px;
    --radius-md: 8px;
    --radius-sm: 6px;

    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 380px;
    max-height: 580px;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--text-primary);
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  body.mofish {
    background: #ffffff !important;
  }
  body.mofish .up, body.mofish .down {
    color: #64748b !important;
    background: transparent !important;
  }
  body.mofish .num-blur {
    filter: blur(4px);
    user-select: none;
  }

  .container {
    padding: 12px 14px;
  }

  .card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }

  .view {
    display: none;
  }
  .view.active {
    display: block;
  }

  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .brand-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-title::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
  }

  .actions-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .add-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--btn-primary-text);
    background: var(--btn-primary-bg);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .add-link-btn:hover {
    background: var(--btn-primary-hover);
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .icon-btn:hover {
    background: #f1f5f9;
    color: var(--text-primary);
  }
  .icon-btn:active {
    transform: scale(0.95);
  }
  .icon-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .summary-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--border-color);
  }
  .total-group {
    display: flex;
    gap: 14px;
    align-items: flex-end;
  }
  .total-block .label {
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .total-block .value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .indices-pills {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .idx-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 5px;
    background: #f8fafc;
    border: 1px solid #f1f5f9;
    border-radius: 4px;
    font-size: 10px;
    color: var(--text-secondary);
  }
  .idx-name { font-weight: 500; }
  .idx-val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: right;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border-color);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.15s ease;
  }
  th:first-child { text-align: left; padding-left: 2px; }
  th:hover { color: var(--text-primary); }
  th.sort-active { color: var(--border-focus); font-weight: 600; }

  tr {
    height: 44px;
  }
  td {
    height: 44px;
    padding: 0 4px;
    text-align: right;
    font-size: 12px;
    border-bottom: 1px solid #f1f5f9;
    white-space: nowrap;
    vertical-align: middle;
  }
  td.stock-name-cell {
    text-align: left;
    font-weight: 600;
    color: var(--border-focus);
    padding-left: 2px;
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  td.stock-name-cell:hover {
    text-decoration: underline;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(248, 250, 252, 0.8); }

  .stock-sub {
    font-size: 10px;
    font-weight: normal;
    color: var(--text-muted);
    display: block;
    line-height: 1.2;
    margin-top: 1px;
  }

  .up {
    color: var(--up-color);
    font-weight: 500;
  }
  .down {
    color: var(--down-color);
    font-weight: 500;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 28px 0;
    font-size: 12px;
  }
  .loading-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 10px 0;
    font-size: 11px;
  }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .back-btn:hover {
    color: var(--text-primary);
  }
  .detail-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .form-group input {
    height: 32px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 8px;
    font-size: 12px;
    color: var(--text-primary);
    background: #f8fafc;
    outline: none;
    transition: all 0.15s ease;
  }
  .form-group input:focus {
    border-color: var(--border-focus);
    background: #ffffff;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
  }

  .stats-summary-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .stats-summary-card .stat-item {
    display: flex;
    flex-direction: column;
  }
  .stats-summary-card .stat-val {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }

  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .records-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .btn-add-record {
    background: transparent;
    border: none;
    color: var(--border-focus);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-add-record:hover {
    text-decoration: underline;
  }

  .records-sub-header {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 24px;
    gap: 6px;
    padding: 0 2px;
    margin-top: 6px;
    margin-bottom: 2px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .records-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
  }
  .record-row {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 24px;
    gap: 6px;
    align-items: center;
  }
  .record-row input {
    height: 32px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 6px;
    font-size: 11px;
    color: var(--text-primary);
    background: #f8fafc;
    outline: none;
    transition: all 0.15s ease;
    width: 100%;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .record-row input[type="date"] {
    font-family: inherit;
    font-size: 11px;
    padding: 0 4px;
  }
  .record-row input:focus {
    border-color: var(--border-focus);
    background: #ffffff;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
  }
  .remove-rec-btn {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    background: #f1f5f9;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.15s ease;
    user-select: none;
  }
  .remove-rec-btn:hover {
    background: var(--up-bg);
    color: var(--up-color);
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }
  .btn-save {
    flex: 1;
    height: 36px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-save:hover {
    background: var(--btn-primary-hover);
  }
  .btn-delete {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: #ffffff;
    color: var(--btn-danger-bg);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-delete:hover {
    background: var(--up-bg);
    border-color: var(--up-color);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">

      <div id="viewList" class="view active">

        <div class="header-bar">
          <div class="brand-title">极简盯盘</div>
          <div class="actions-group">
            <button class="add-link-btn" id="openAddBtn">
              <span>+ 添加持仓</span>
            </button>
            <button class="icon-btn" id="refreshBtn" title="刷新行情">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button class="icon-btn" id="mofishBtn" title="摸鱼隐私模式">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="summary-section">
          <div class="total-group">
            <div class="total-block">
              <div class="label">今日浮盈</div>
              <div class="value num-blur" id="totalToday">--</div>
            </div>
            <div class="total-block">
              <div class="label">持仓盈亏</div>
              <div class="value num-blur" id="totalHolding">--</div>
            </div>
          </div>
          <div class="indices-pills">
            <div class="idx-pill">
              <span class="idx-name">上证</span>
              <span class="idx-val" id="idxSh">--</span>
            </div>
            <div class="idx-pill">
              <span class="idx-name">沪深300</span>
              <span class="idx-val" id="idxHs300">--</span>
            </div>
            <div class="idx-pill">
              <span class="idx-name">创业板</span>
              <span class="idx-val" id="idxCyb">--</span>
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-key="name">名称</th>
                <th data-key="current">最新价</th>
                <th data-key="changePercent">涨跌幅 ↕</th>
                <th data-key="todayProfit">今日浮盈</th>
                <th data-key="holdingProfit">持仓盈亏</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state">暂无持仓，请点击上方按钮添加</div>
        <div id="loadingState" class="loading-state" style="display:none;">正在更新行情...</div>
      </div>

      <div id="viewDetail" class="view">
        <div class="detail-header">
          <button class="back-btn" id="backBtn">
            <span>← 返回列表</span>
          </button>
          <div class="detail-title" id="detailHeaderTitle">编辑持仓</div>
        </div>

        <div class="edit-form">
          <div class="form-group">
            <label for="detailCode">股票/基金代码</label>
            <input id="detailCode" placeholder="如 603136 / 天目湖 / AAPL" autocomplete="off" />
          </div>

          <div class="stats-summary-card">
            <div class="stat-item">
              <span>综合加权成本</span>
              <span class="stat-val" id="summaryAvgCost">--</span>
            </div>
            <div class="stat-item">
              <span>总持仓股数</span>
              <span class="stat-val" id="summaryTotalShares">0</span>
            </div>
            <div class="stat-item">
              <span>历史总投入</span>
              <span class="stat-val" id="summaryTotalCost">--</span>
            </div>
          </div>

          <div class="records-header">
            <span>买入明细记录 (支持多笔补仓)</span>
            <button class="btn-add-record" id="addRecordBtn">+ 新增一笔买入</button>
          </div>
          <div class="records-sub-header">
            <span>买入日期</span>
            <span>买入单价</span>
            <span>买入股数</span>
            <span></span>
          </div>
          <div class="records-list" id="recordsList"></div>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="saveDetailBtn">保存持仓</button>
          <button class="btn-delete" id="deleteDetailBtn" style="display: none;">删除持仓</button>
        </div>
      </div>

    </div>
  </div>

  <script src="src/storage.js"></script>
  <script src="src/quote.js"></script>
  <script src="src/calc.js"></script>
  <script src="src/popup.js"></script>
</body>
</html>
