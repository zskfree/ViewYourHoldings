<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>极简盯盘-持仓盈亏</title>
<style>

  :root {
    color-scheme: light dark;
    --bg-page: #f2f2f7;
    --bg-card: rgba(255, 255, 255, 0.84);
    --bg-elevated: rgba(255, 255, 255, 0.96);
    --bg-subtle: rgba(118, 118, 128, 0.08);
    --bg-hover: rgba(118, 118, 128, 0.10);
    --border-color: rgba(60, 60, 67, 0.16);
    --border-focus: #007aff;

    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-muted: #8e8e93;

    --up-color: #ef4444;
    --up-bg: rgba(239, 68, 68, 0.08);
    --down-color: #10b981;
    --down-bg: rgba(16, 185, 129, 0.08);

    --btn-primary-bg: #1d1d1f;
    --btn-primary-text: #ffffff;
    --btn-primary-hover: #343438;
    --btn-danger-bg: #ef4444;
    --btn-danger-hover: #dc2626;

    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 9px;

    --shadow-sm: 0 12px 32px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-popover: 0 18px 48px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.08);
    --focus-ring: 0 0 0 3px rgba(0, 122, 255, 0.22);
    --up-flash: rgba(239, 68, 68, 0.14);
    --down-flash: rgba(16, 185, 129, 0.14);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0b0b0c;
      --bg-card: rgba(28, 28, 30, 0.88);
      --bg-elevated: rgba(44, 44, 46, 0.98);
      --bg-subtle: rgba(118, 118, 128, 0.18);
      --bg-hover: rgba(118, 118, 128, 0.22);
      --border-color: rgba(84, 84, 88, 0.56);
      --border-focus: #0a84ff;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-muted: #8e8e93;
      --up-color: #ff453a;
      --up-bg: rgba(255, 69, 58, 0.14);
      --down-color: #30d158;
      --down-bg: rgba(48, 209, 88, 0.14);
      --btn-primary-bg: #f5f5f7;
      --btn-primary-text: #1d1d1f;
      --btn-primary-hover: #ffffff;
      --btn-danger-bg: #ff453a;
      --btn-danger-hover: #ff6961;
      --shadow-sm: 0 14px 34px rgba(0, 0, 0, 0.36), 0 1px 0 rgba(255, 255, 255, 0.06) inset;
      --shadow-popover: 0 20px 52px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
      --focus-ring: 0 0 0 3px rgba(10, 132, 255, 0.30);
      --up-flash: rgba(255, 69, 58, 0.18);
      --down-flash: rgba(48, 209, 88, 0.18);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 380px;
    max-height: 580px;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-page);
    -webkit-font-smoothing: antialiased;
  }

  body.mofish {
    background: var(--bg-page) !important;
  }
  body.mofish .up, body.mofish .down {
    color: var(--text-secondary) !important;
    background: transparent !important;
  }
  body.mofish .num-blur {
    filter: none;
  }
  body.mofish #openAddBtn {
    display: none;
  }
  body.mofish .stock-name-cell {
    color: var(--text-primary);
    cursor: default;
  }
  body.mofish .stock-name-cell:hover {
    text-decoration: none;
  }

  .container {
    padding: 10px;
  }

  .card {
    position: relative;
    overflow: clip;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
  }

  .view {
    display: none;
  }
  .view.active {
    display: block;
  }
  .view.view-leaving {
    position: absolute;
    inset: 12px 14px;
    z-index: 3;
    display: block;
    width: auto;
  }

  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: -12px;
    z-index: 2;
    margin: -12px -14px 12px;
    padding: 12px 14px 9px;
    background: color-mix(in srgb, var(--bg-card) 88%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 65%, transparent);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }
  .brand-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-title::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
  }

  .actions-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .add-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--btn-primary-text);
    background: var(--btn-primary-bg);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease;
  }
  .add-link-btn:hover {
    background: var(--btn-primary-hover);
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    background: transparent;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
  }
  .icon-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .icon-btn:active {
    transform: scale(0.94);
  }
  .icon-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .summary-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--border-color);
  }
  .total-group {
    display: flex;
    gap: 14px;
    align-items: flex-end;
  }
  .total-block .label {
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .total-block .value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .indices-pills {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .idx-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 5px;
    background: var(--bg-subtle);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 10px;
    color: var(--text-secondary);
  }
  .idx-name { font-weight: 500; }
  .idx-val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: hidden;
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th:nth-child(1), td:nth-child(1) { width: 24%; }
  th:nth-child(2), td:nth-child(2) { width: 16%; }
  th:nth-child(3), td:nth-child(3) { width: 18%; }
  th:nth-child(4), td:nth-child(4) { width: 19%; }
  th:nth-child(5), td:nth-child(5) { width: 23%; }
  th {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: right;
    padding: 6px 2px;
    border-bottom: 1px solid var(--border-color);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-radius: 6px 6px 0 0;
    transition: transform 120ms var(--ease-out), color 150ms ease, background-color 150ms ease;
  }
  th:first-child { text-align: left; padding-left: 2px; }
  th:hover { color: var(--text-primary); }
  th:active { transform: scale(0.97); }
  th.sort-active { color: var(--border-focus); font-weight: 600; }
  th[data-key="changePercent"]:not(.sort-active)::after { content: " ↕"; }
  th.sort-active.sort-asc::after { content: " ↑"; }
  th.sort-active.sort-desc::after { content: " ↓"; }

  tr {
    height: 44px;
  }
  tbody tr.interactive-row {
    cursor: pointer;
    transform-origin: center;
    transition: transform 120ms var(--ease-out), background-color 150ms ease;
  }
  tbody tr.interactive-row:active {
    transform: scale(0.995);
    background: var(--bg-hover);
  }
  td {
    height: 44px;
    padding: 0 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
    font-size: 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 58%, transparent);
    white-space: nowrap;
    vertical-align: middle;
  }
  td.stock-name-cell {
    text-align: left;
    font-weight: 600;
    color: var(--border-focus);
    padding-left: 2px;
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  td.stock-name-cell:hover {
    text-decoration: underline;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-hover); }

  .stock-sub {
    font-size: 10px;
    font-weight: normal;
    color: var(--text-muted);
    display: block;
    line-height: 1.2;
    margin-top: 1px;
  }

  .up {
    color: var(--up-color);
    font-weight: 500;
  }
  .down {
    color: var(--down-color);
    font-weight: 500;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 28px 0;
    font-size: 12px;
  }
  .loading-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 10px 0;
    font-size: 11px;
  }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .back-btn:hover {
    color: var(--text-primary);
  }
  .detail-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .form-group input {
    height: 32px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 8px;
    font-size: 12px;
    color: var(--text-primary);
    background: var(--bg-subtle);
    outline: none;
    transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
  }
  .form-group input:focus {
    border-color: var(--border-focus);
    background: var(--bg-elevated);
    box-shadow: var(--focus-ring);
  }

  .stats-summary-card {
    background: var(--bg-subtle);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .stats-summary-card .stat-item {
    display: flex;
    flex-direction: column;
  }
  .stats-summary-card .stat-val {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }

  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .records-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .btn-add-record {
    background: transparent;
    border: none;
    color: var(--border-focus);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-add-record:hover {
    text-decoration: underline;
  }

  .records-sub-header {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 24px;
    gap: 6px;
    padding: 0 2px;
    margin-top: 6px;
    margin-bottom: 2px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .records-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
  }
  .record-row {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 24px;
    gap: 6px;
    align-items: center;
  }
  .record-row input {
    height: 32px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 6px;
    font-size: 11px;
    color: var(--text-primary);
    background: var(--bg-subtle);
    outline: none;
    transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    width: 100%;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .record-row input[type="date"] {
    font-family: inherit;
    font-size: 11px;
    padding: 0 4px;
  }
  .record-row input:focus {
    border-color: var(--border-focus);
    background: var(--bg-elevated);
    box-shadow: var(--focus-ring);
  }
  .remove-rec-btn {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    border: none;
    background: var(--bg-subtle);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: transform 120ms var(--ease-out), background-color 150ms ease, color 150ms ease;
    user-select: none;
  }
  .remove-rec-btn:hover {
    background: var(--up-bg);
    color: var(--up-color);
  }

  .form-actions {
    position: relative;
    display: flex;
    gap: 8px;
  }
  .btn-save {
    flex: 1;
    height: 36px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 160ms ease, box-shadow 160ms ease;
  }
  .btn-save:hover {
    background: var(--btn-primary-hover);
  }
  .btn-delete {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--btn-danger-bg);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  .btn-delete:hover {
    background: var(--up-bg);
    border-color: var(--up-color);
  }

  button,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:active,
  .remove-rec-btn:active {
    transform: scale(0.97);
  }
  button:focus-visible,
  [role="button"]:focus-visible,
  input:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .record-row {
    transform-origin: top center;
  }

  .confirm-popover {
    --origin-x: calc(100% - 24px);
    --origin-y: 100%;
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    z-index: 10;
    width: 248px;
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 13px;
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: var(--shadow-popover);
    transform-origin: var(--origin-x) var(--origin-y);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
  }
  .confirm-popover[hidden] { display: none; }
  .confirm-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .confirm-copy {
    margin-top: 4px;
    color: var(--text-secondary);
    font-size: 11px;
    line-height: 1.45;
  }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
  }
  .confirm-actions button {
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-subtle);
    color: var(--text-primary);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 150ms ease, color 150ms ease;
  }
  .confirm-actions .confirm-danger {
    border-color: transparent;
    background: var(--btn-danger-bg);
    color: #fff;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">

      <div id="viewList" class="view active">

        <div class="header-bar">
          <div class="brand-title" data-normal-text="极简盯盘" data-boss-text="项目数据概览">极简盯盘</div>
          <div class="actions-group">
            <button class="add-link-btn" id="openAddBtn">
              <span data-normal-text="+ 添加持仓" data-boss-text="+ 新建项目">+ 添加持仓</span>
            </button>
            <button class="icon-btn" id="refreshBtn" title="刷新行情" aria-label="刷新行情">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button class="icon-btn" id="mofishBtn" title="启用老板键" aria-label="切换隐私模式" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="summary-section">
          <div class="total-group">
            <div class="total-block">
              <div class="label" data-normal-text="今日浮盈" data-boss-text="今日进展">今日浮盈</div>
              <div class="value num-blur" id="totalToday">--</div>
            </div>
            <div class="total-block">
              <div class="label" data-normal-text="持仓盈亏" data-boss-text="累计进展">持仓盈亏</div>
              <div class="value num-blur" id="totalHolding">--</div>
            </div>
          </div>
          <div class="indices-pills">
            <div class="idx-pill">
              <span class="idx-name" data-normal-text="上证" data-boss-text="区域 A">上证</span>
              <span class="idx-val" id="idxSh">--</span>
            </div>
            <div class="idx-pill">
              <span class="idx-name" data-normal-text="沪深300" data-boss-text="区域 B">沪深300</span>
              <span class="idx-val" id="idxHs300">--</span>
            </div>
            <div class="idx-pill">
              <span class="idx-name" data-normal-text="创业板" data-boss-text="区域 C">创业板</span>
              <span class="idx-val" id="idxCyb">--</span>
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col" tabindex="0" aria-sort="none" data-key="name" data-normal-text="名称" data-boss-text="项目">名称</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="current" data-normal-text="最新价" data-boss-text="当前值">最新价</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="changePercent" data-normal-text="涨跌幅" data-boss-text="日变化">涨跌幅</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="todayProfit" data-normal-text="今日浮盈" data-boss-text="今日进展">今日浮盈</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="holdingProfit" data-normal-text="持仓盈亏" data-boss-text="累计进展">持仓盈亏</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" data-normal-text="暂无持仓，请点击上方按钮添加" data-boss-text="暂无项目数据">暂无持仓，请点击上方按钮添加</div>
        <div id="loadingState" class="loading-state" style="display:none;">正在更新行情...</div>
      </div>

      <div id="viewDetail" class="view">
        <div class="detail-header">
          <button class="back-btn" id="backBtn">
            <span>← 返回列表</span>
          </button>
          <div class="detail-title" id="detailHeaderTitle">编辑持仓</div>
        </div>

        <div class="edit-form">
          <div class="form-group">
            <label for="detailCode">股票/基金代码</label>
            <input id="detailCode" placeholder="如 603136 / 天目湖 / AAPL" autocomplete="off" />
          </div>

          <div class="stats-summary-card">
            <div class="stat-item">
              <span>综合加权成本</span>
              <span class="stat-val" id="summaryAvgCost">--</span>
            </div>
            <div class="stat-item">
              <span>总持仓股数</span>
              <span class="stat-val" id="summaryTotalShares">0</span>
            </div>
            <div class="stat-item">
              <span>历史总投入</span>
              <span class="stat-val" id="summaryTotalCost">--</span>
            </div>
          </div>

          <div class="records-header">
            <span>买入明细记录 (支持多笔补仓)</span>
            <button class="btn-add-record" id="addRecordBtn">+ 新增一笔买入</button>
          </div>
          <div class="records-sub-header">
            <span>买入日期</span>
            <span>买入单价</span>
            <span>买入股数</span>
            <span></span>
          </div>
          <div class="records-list" id="recordsList"></div>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="saveDetailBtn">保存持仓</button>
          <button class="btn-delete" id="deleteDetailBtn" style="display: none;">删除持仓</button>
          <div class="confirm-popover" id="deleteConfirmPopover" role="alertdialog" aria-modal="true" aria-labelledby="deleteConfirmTitle" aria-describedby="deleteConfirmCopy" hidden>
            <div class="confirm-title" id="deleteConfirmTitle">删除这项持仓？</div>
            <div class="confirm-copy" id="deleteConfirmCopy">买入记录将从本机移除，此操作无法撤销。</div>
            <div class="confirm-actions">
              <button type="button" id="cancelDeleteBtn">取消</button>
              <button type="button" class="confirm-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
