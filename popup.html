<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>极简盯盘-持仓盈亏</title>
<style>

  :root {
    color-scheme: light dark;
    --bg-page: #eaf0f6;
    --bg-card: rgba(255, 255, 255, 0.45);
    --bg-elevated: rgba(255, 255, 255, 0.65);
    --bg-glass-pill: transparent;
    --bg-subtle: rgba(118, 118, 128, 0.05);
    --bg-hover: rgba(118, 118, 128, 0.12);
    --border-color: rgba(60, 60, 67, 0.14);
    --border-focus: #007aff;
    --glass-border: rgba(255, 255, 255, 0.65);

    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-muted: #8e8e93;

    --up-color: #ff3b30;
    --up-bg: rgba(255, 59, 48, 0.10);
    --down-color: #34c759;
    --down-bg: rgba(52, 199, 89, 0.10);

    --btn-primary-bg: #1d1d1f;
    --btn-primary-text: #ffffff;
    --btn-primary-hover: #343438;
    --btn-danger-bg: #ef4444;
    --btn-danger-hover: #dc2626;

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 10px;

    --shadow-sm: inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.8), 0 6px 18px -4px rgba(0, 0, 0, 0.06);
    --shadow-card: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03), 0 20px 48px -12px rgba(30, 41, 59, 0.12), 0 2px 8px -2px rgba(0, 0, 0, 0.04);
    --shadow-popover: inset 0 1px 1px 0 rgba(255, 255, 255, 0.9), 0 24px 56px -8px rgba(0, 0, 0, 0.22), 0 4px 16px -2px rgba(0, 0, 0, 0.08);
    --focus-ring: 0 0 0 3px rgba(0, 122, 255, 0.28), 0 2px 8px rgba(0, 122, 255, 0.12);
    --up-flash: rgba(239, 68, 68, 0.18);
    --down-flash: rgba(16, 185, 129, 0.18);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0b0d12;
      --bg-card: rgba(20, 22, 28, 0.45);
      --bg-elevated: rgba(30, 32, 40, 0.65);
      --bg-glass-pill: transparent;
      --bg-subtle: rgba(255, 255, 255, 0.04);
      --bg-hover: rgba(255, 255, 255, 0.08);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #0a84ff;
      --glass-border: rgba(255, 255, 255, 0.25);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-muted: #8e8e93;
      --up-color: #ff453a;
      --up-bg: rgba(255, 69, 58, 0.16);
      --down-color: #30d158;
      --down-bg: rgba(48, 209, 88, 0.16);
      --btn-primary-bg: #f5f5f7;
      --btn-primary-text: #1d1d1f;
      --btn-primary-hover: #ffffff;
      --btn-danger-bg: #ff453a;
      --btn-danger-hover: #ff6961;
      --shadow-sm: inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.12), 0 8px 24px -4px rgba(0, 0, 0, 0.3);
      --shadow-card: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.5), 0 24px 56px -12px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-popover: inset 0 1px 1px 0 rgba(255, 255, 255, 0.22), 0 28px 64px rgba(0, 0, 0, 0.65);
      --focus-ring: 0 0 0 3px rgba(10, 132, 255, 0.36), 0 2px 10px rgba(10, 132, 255, 0.2);
      --up-flash: rgba(255, 69, 58, 0.22);
      --down-flash: rgba(48, 209, 88, 0.22);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    max-height: 600px;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--text-primary);
    background: transparent;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--text-secondary) 50%, transparent);
  }

  @media (prefers-color-scheme: dark) {
    /* dark mode adjustments handled inside the card now */
  }

  @keyframes aurora {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.05) translate(-10px, 15px); }
  }

  body.mofish {
    background: var(--bg-page) !important;
  }
  body.mofish .up, body.mofish .down {
    color: var(--text-secondary) !important;
    background: transparent !important;
  }
  body.mofish .num-blur {
    filter: none;
  }
  body.mofish #openAddBtn {
    display: none;
  }
  body.mofish .stock-name-cell {
    color: var(--text-primary);
    cursor: default;
  }
  body.mofish .stock-name-cell:hover {
    text-decoration: none;
  }

  .container {
    padding: 0;
    position: relative;
    z-index: 1;
  }

  .card {
    position: relative;
    overflow: clip;
    background: var(--bg-card);
    border: none;
    border-radius: 0;
    padding: 24px;
    box-shadow: none;
    backdrop-filter: blur(48px) saturate(200%) contrast(105%);
    -webkit-backdrop-filter: blur(48px) saturate(200%) contrast(105%);
  }

  .card::before {
    content: "";
    position: absolute;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 30% 30%, rgba(224, 195, 252, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(142, 197, 252, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.7) 0%, transparent 50%);
    filter: blur(40px);
    pointer-events: none;
    z-index: -1;
    animation: aurora 12s ease-in-out infinite alternate;
  }

  @media (prefers-color-scheme: dark) {
    .card::before {
      background: radial-gradient(circle at 30% 30%, rgba(94, 53, 177, 0.4) 0%, transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(30, 136, 229, 0.4) 0%, transparent 60%),
                  radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
    }
  }

  .view {
    display: none;
  }
  .view.active {
    display: block;
  }
  .view.view-leaving {
    position: absolute;
    inset: 12px 14px;
    z-index: 3;
    display: block;
    width: auto;
  }

  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: -24px;
    z-index: 2;
    margin: -24px -24px 16px;
    padding: 24px 24px 12px;
    background: transparent;
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 40%, transparent);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  }
  .brand-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand-title::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
    animation: pulseDot 2.4s infinite;
  }

  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .actions-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .add-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-primary);
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 99px;
    cursor: pointer;
    box-shadow: none;
    transition: transform 140ms var(--ease-spring), background-color 160ms ease, border-color 160ms ease;
  }
  .add-link-btn:hover {
    background: var(--bg-hover);
    border-color: color-mix(in srgb, var(--border-color) 80%, transparent);
    transform: translateY(-1px);
  }
  .add-link-btn:active {
    transform: scale(0.95) translateY(0);
    transition: transform 80ms var(--ease-out);
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    background: transparent;
    cursor: pointer;
    transition: transform 140ms var(--ease-spring), background-color 160ms ease, color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  .icon-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--border-color);
    transform: scale(1.05);
  }
  .icon-btn:active {
    transform: scale(0.92);
    transition: transform 80ms var(--ease-out);
  }
  .icon-btn svg { width: 14px; height: 14px; stroke-width: 2; transition: transform 200ms ease; }
  .icon-btn.spinning svg { animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .summary-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    gap: 12px;
  }
  .total-group {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    flex: 1;
    min-width: 0;
  }
  .total-block {
    min-width: 0;
    flex: 1;
  }
  .total-block .label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .total-block .value {
    font-size: clamp(16px, 5.5vw, 32px);
    font-weight: 300;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .indices-pills {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }
  .idx-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    background: transparent;
    border: none;
    font-size: 11px;
    color: var(--text-secondary);
    box-shadow: none;
    transition: transform 140ms var(--ease-spring), opacity 160ms ease;
  }
  .idx-pill:hover {
    transform: translateX(-2px);
    opacity: 0.8;
  }
  .idx-name { font-weight: 500; }
  .idx-val {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: hidden;
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th:nth-child(1), td:nth-child(1) { width: 24%; }
  th:nth-child(2), td:nth-child(2) { width: 16%; }
  th:nth-child(3), td:nth-child(3) { width: 18%; }
  th:nth-child(4), td:nth-child(4) { width: 19%; }
  th:nth-child(5), td:nth-child(5) { width: 23%; }
  th {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: color-mix(in srgb, var(--text-secondary) 80%, transparent);
    text-align: right;
    padding: 8px 4px 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 40%, transparent);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: transform 120ms var(--ease-out), color 150ms ease;
  }
  th:first-child { text-align: left; padding-left: 4px; }
  th:hover { color: var(--text-primary); }
  th:active { transform: scale(0.97); }
  th.sort-active { color: var(--border-focus); font-weight: 600; }
  th[data-key="changePercent"]:not(.sort-active)::after { content: " ↕"; opacity: 0.6; }
  th.sort-active.sort-asc::after { content: " ↑"; }
  th.sort-active.sort-desc::after { content: " ↓"; }

  tr {
    height: 48px;
  }
  tbody tr.interactive-row {
    cursor: pointer;
    transform-origin: center;
    border-radius: var(--radius-sm);
    transition: transform 140ms var(--ease-spring), background-color 160ms ease, box-shadow 160ms ease;
  }
  tbody tr.interactive-row:active {
    transform: scale(0.985);
    background: var(--bg-hover);
  }
  td {
    height: 48px;
    padding: 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
    font-size: 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 40%, transparent);
    white-space: nowrap;
    vertical-align: middle;
    max-width: 0;
  }
  td.stock-name-cell {
    text-align: left;
    font-weight: 600;
    color: var(--border-focus);
    padding-left: 4px;
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: color 0.15s ease, opacity 0.15s ease;
  }
  td.stock-name-cell:hover {
    text-decoration: underline;
    opacity: 0.85;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-hover); }

  .stock-sub {
    font-size: 10px;
    font-weight: normal;
    color: var(--text-muted);
    display: block;
    line-height: 1.2;
    margin-top: 1px;
  }

  .up {
    color: var(--up-color);
    font-weight: 600;
  }
  .down {
    color: var(--down-color);
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 32px 0;
    font-size: 12px;
  }
  .loading-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 12px 0;
    font-size: 11px;
  }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: transform 160ms var(--ease-out), color 160ms ease;
  }
  .back-btn:hover {
    color: var(--text-primary);
    transform: translateX(-2px);
  }
  .detail-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .form-group input {
    height: 34px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    font-size: 12px;
    color: var(--text-primary);
    background: var(--bg-subtle);
    outline: none;
    backdrop-filter: blur(8px);
    transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease, transform 140ms var(--ease-spring);
  }
  .form-group input:focus {
    border-color: var(--border-focus);
    background: var(--bg-elevated);
    box-shadow: var(--focus-ring);
    transform: scale(1.005);
  }

  .stats-summary-card {
    background: var(--bg-glass-pill);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 9px 12px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    box-shadow: var(--shadow-sm);
    gap: 8px;
  }
  .stats-summary-card .stat-item {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .stats-summary-card .stat-val {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .records-header span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .btn-add-record {
    background: transparent;
    border: none;
    color: var(--border-focus);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 140ms ease, transform 120ms ease;
  }
  .btn-add-record:hover {
    text-decoration: underline;
    opacity: 0.85;
  }

  .records-sub-header {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 24px;
    gap: 6px;
    padding: 0 2px;
    margin-top: 6px;
    margin-bottom: 2px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .records-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
    padding: 6px;
    margin: -6px;
  }
  .record-row {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 24px;
    gap: 6px;
    align-items: center;
  }
  .record-row input {
    height: 32px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0 6px;
    font-size: 11px;
    color: var(--text-primary);
    background: var(--bg-subtle);
    outline: none;
    transition: border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    width: 100%;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .record-row input[type="number"]::-webkit-outer-spin-button,
  .record-row input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .record-row input[type="number"] {
    -moz-appearance: textfield;
  }
  .record-row input.rec-date {
    font-family: inherit;
    font-size: 11px;
    padding: 0 6px;
  }
  .record-row input:focus {
    border-color: var(--border-focus);
    background: var(--bg-elevated);
    box-shadow: var(--focus-ring);
    position: relative;
    z-index: 10;
  }
  .remove-rec-btn {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    border: none;
    background: var(--bg-subtle);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: transform 140ms var(--ease-spring), background-color 150ms ease, color 150ms ease;
    user-select: none;
  }
  .remove-rec-btn:hover {
    background: var(--up-bg);
    color: var(--up-color);
  }

  .form-actions {
    position: relative;
    display: flex;
    gap: 8px;
  }
  .btn-save {
    flex: 1;
    height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-sm);
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 8px rgba(0, 0, 0, 0.12);
    transition: transform 140ms var(--ease-spring), background-color 160ms ease, box-shadow 160ms ease;
  }
  .btn-save:hover {
    background: var(--btn-primary-hover);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 4px 14px rgba(0, 0, 0, 0.18);
  }
  .btn-delete {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--btn-danger-bg);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 140ms var(--ease-spring), background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  .btn-delete:hover {
    background: var(--up-bg);
    border-color: var(--up-color);
    transform: translateY(-1px);
  }

  button,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:active,
  .remove-rec-btn:active {
    transform: scale(0.95);
  }
  button:focus-visible,
  [role="button"]:focus-visible,
  input:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .record-row {
    transform-origin: top center;
  }

  .confirm-popover {
    --origin-x: calc(100% - 24px);
    --origin-y: 100%;
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    z-index: 10;
    width: 248px;
    padding: 12px;
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: var(--shadow-popover);
    transform-origin: var(--origin-x) var(--origin-y);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
  }
  .confirm-popover[hidden] { display: none; }
  .confirm-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .confirm-copy {
    margin-top: 4px;
    color: var(--text-secondary);
    font-size: 11px;
    line-height: 1.45;
  }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
  }
  .confirm-actions button {
    height: 30px;
    padding: 0 11px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-subtle);
    color: var(--text-primary);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform 140ms var(--ease-spring), background-color 150ms ease, color 150ms ease;
  }
  .confirm-actions .confirm-danger {
    border-color: transparent;
    background: var(--btn-danger-bg);
    color: #fff;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div id="viewList" class="view active">

        <div class="header-bar">
          <div class="brand-title" data-normal-text="极简盯盘" data-boss-text="项目数据概览">极简盯盘</div>
          <div class="actions-group">
            <button class="add-link-btn" id="openAddBtn">
              <span data-normal-text="+ 添加持仓" data-boss-text="+ 新建项目">+ 添加持仓</span>
            </button>
            <button class="icon-btn" id="refreshBtn" title="刷新行情" aria-label="刷新行情">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </button>
            <button class="icon-btn" id="mofishBtn" title="启用老板键" aria-label="切换隐私模式" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="summary-section">
          <div class="total-group">
            <div class="total-block">
              <div class="label" data-normal-text="今日浮盈" data-boss-text="今日进展">今日浮盈</div>
              <div class="value num-blur" id="totalToday">--</div>
            </div>
            <div class="total-block">
              <div class="label" data-normal-text="持仓盈亏" data-boss-text="累计进展">持仓盈亏</div>
              <div class="value num-blur" id="totalHolding">--</div>
            </div>
          </div>
          <div class="indices-pills">
            <div class="idx-pill">
              <span class="idx-name" data-normal-text="上证" data-boss-text="区域 A">上证</span>
              <span class="idx-val" id="idxSh">--</span>
            </div>
            <div class="idx-pill">
              <span class="idx-name" data-normal-text="沪深300" data-boss-text="区域 B">沪深300</span>
              <span class="idx-val" id="idxHs300">--</span>
            </div>
            <div class="idx-pill">
              <span class="idx-name" data-normal-text="创业板" data-boss-text="区域 C">创业板</span>
              <span class="idx-val" id="idxCyb">--</span>
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col" tabindex="0" aria-sort="none" data-key="name" data-normal-text="名称" data-boss-text="项目">名称</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="current" data-normal-text="最新价" data-boss-text="当前值">最新价</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="changePercent" data-normal-text="涨跌幅" data-boss-text="日变化">涨跌幅</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="todayProfit" data-normal-text="今日浮盈" data-boss-text="今日进展">今日浮盈</th>
                <th scope="col" tabindex="0" aria-sort="none" data-key="holdingProfit" data-normal-text="持仓盈亏" data-boss-text="累计进展">持仓盈亏</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" data-normal-text="暂无持仓，请点击上方按钮添加" data-boss-text="暂无项目数据">暂无持仓，请点击上方按钮添加</div>
        <div id="loadingState" class="loading-state" style="display:none;">正在更新行情...</div>
      </div>

      <div id="viewDetail" class="view">
        <div class="detail-header">
          <button class="back-btn" id="backBtn">
            <span>← 返回列表</span>
          </button>
          <div class="detail-title" id="detailHeaderTitle">编辑持仓</div>
        </div>

        <div class="edit-form">
          <div class="form-group">
            <label for="detailCode">股票/基金代码</label>
            <input id="detailCode" placeholder="如 603136 / 天目湖 / AAPL" autocomplete="off" />
          </div>

          <div class="stats-summary-card">
            <div class="stat-item">
              <span>综合加权成本</span>
              <span class="stat-val" id="summaryAvgCost">--</span>
            </div>
            <div class="stat-item">
              <span>总持仓股数</span>
              <span class="stat-val" id="summaryTotalShares">0</span>
            </div>
            <div class="stat-item">
              <span>历史总投入</span>
              <span class="stat-val" id="summaryTotalCost">--</span>
            </div>
          </div>

          <div class="records-header">
            <span>买入明细记录 (支持多笔补仓)</span>
            <button class="btn-add-record" id="addRecordBtn">+ 新增一笔买入</button>
          </div>
          <div class="records-sub-header">
            <span>买入日期</span>
            <span>买入单价</span>
            <span>买入股数</span>
            <span></span>
          </div>
          <div class="records-list" id="recordsList"></div>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="saveDetailBtn">保存持仓</button>
          <button class="btn-delete" id="deleteDetailBtn" style="display: none;">删除持仓</button>
          <div class="confirm-popover" id="deleteConfirmPopover" role="alertdialog" aria-modal="true" aria-labelledby="deleteConfirmTitle" aria-describedby="deleteConfirmCopy" hidden>
            <div class="confirm-title" id="deleteConfirmTitle">删除这项持仓？</div>
            <div class="confirm-copy" id="deleteConfirmCopy">买入记录将从本机移除，此操作无法撤销。</div>
            <div class="confirm-actions">
              <button type="button" id="cancelDeleteBtn">取消</button>
              <button type="button" class="confirm-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
